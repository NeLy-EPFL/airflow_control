<!-- Ball delivery plugin panel: inserted above the MFC panels. -->
<link rel="stylesheet" href="/plugins/ball_delivery/panel.css">
<section id="loop" class="channel loop">
  <header class="ch-head">
    <div>
      <h2>Ball delivery</h2>
      <div class="ch-meta dim mono loop-source"></div>
    </div>
    <div class="row">
      <span class="badge loop-state">off</span>
      <button class="btn btn-primary loop-arm">Arm</button>
    </div>
  </header>
  <div class="ch-error loop-error" hidden></div>

  <div class="loop-body">
    <div class="cam">
      <div class="cam-wrap">
        <canvas class="cam-canvas"></canvas>
        <div class="cam-empty dim">waiting for camera frames…</div>
      </div>
      <div class="row cam-tools">
        <span class="dim">mark:</span>
        <button class="btn tool" data-kind="ball" title="Drag a box around the ball">Ball</button>
        <button class="btn tool" data-kind="ball_extra" title="Drag a box around the ball where it waits partly out of view">+ Ball at edge</button>
        <button class="btn tool" data-kind="platform" title="Drag a box over the platform">Platform</button>
        <button class="btn loop-contact" title="Use the current ball position as contact (with no ball in view: a first guess to drag into place)">Set contact</button>
        <button class="btn btn-ghost loop-clear" title="Forget the templates and contact position">Clear</button>
      </div>
      <div class="cam-help dim"></div>
    </div>

    <div class="loop-side">
      <div class="panel ctl">
        <h3>Status</h3>
        <dl class="kv mono">
          <dt>ball</dt><dd class="v-ball">–</dd>
          <dt>distance</dt><dd class="v-dist">–</dd>
          <dt>loop flow</dt><dd class="v-flow">–</dd>
          <dt>deliveries</dt><dd class="v-cycles">–</dd>
          <dt>last delivery at</dt><dd class="v-lastflow">–</dd>
          <dt>camera</dt><dd class="v-perf">–</dd>
        </dl>
      </div>
      <form class="panel ctl loop-params" novalidate>
        <h3>Settings</h3>
        <div class="params"></div>
        <div class="row">
          <button type="submit" class="btn btn-primary">Save</button>
          <span class="state params-state dim"></span>
        </div>
      </form>
    </div>
  </div>

  <figure class="chart">
    <figcaption class="legend">
      <span><i class="sw sw-flow"></i>ball distance to contact (ball diameters)</span>
      <span><i class="sw sw-set"></i>contact / pushed-away thresholds</span>
      <span class="dim">last 30 s</span>
    </figcaption>
    <div class="chart-wrap">
      <canvas class="dist-canvas"></canvas>
      <div class="tooltip" hidden></div>
    </div>
  </figure>
</section>
